---
name: Release disk image
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build disk image run ID to relay (empty = latest successful)"
        required: false
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  release:
    name: Relay artifact to Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve source run
        id: src
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_RUN_ID}" ]; then
            RUN_ID="${INPUT_RUN_ID}"
          else
            RUN_ID=$(gh run list \
              --workflow "Build disk image" \
              --repo "${{ github.repository }}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"
          echo "Relaying artifacts from run ${RUN_ID}"

      - name: Download disk image artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          mkdir -p relay && cd relay
          gh run download "${{ steps.src.outputs.run_id }}" \
            --name armada-disk-image \
            --repo "${{ github.repository }}"
          ls -lh
          # Sanity check: expect the img.gz and its sha256 sidecar (name may end
          # in .img.gz.sha256 or .img.sha256 depending on packaging).
          shopt -s nullglob
          imgs=(armada-*.img.gz)
          [ "${#imgs[@]}" -eq 1 ] && [ -s "${imgs[0]}" ]
          shasum=(armada-*.sha256)
          [ "${#shasum[@]}" -ge 1 ] && [ -s "${shasum[0]}" ]

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          cd relay
          img=$(ls armada-*.img.gz)
          version="${img%.img.gz}"
          TAG="disk-${{ steps.src.outputs.run_id }}"
          DATE=$(date -u +%Y-%m-%d)

          # GitHub caps release assets at 2 GiB; split into 1.9 GiB volumes.
          shopt -s nullglob
          parts=("${img}".part-*)
          if [ "${#parts[@]}" -eq 0 ]; then
            split -b 1900M -d -a 2 "${img}" "${img}.part-"
          fi
          sha256sum "${img}" > "${img}.parts.sha256"
          {
            echo "Disk image built by Actions run ${{ steps.src.outputs.run_id }}."
            echo ""
            echo "Includes Odin 2 Mini sleep-drain fix (kernel patches 0058a / 0059a)."
            echo ""
            echo "The image is split into parts (GitHub 2 GiB asset limit)."
            echo "Rejoin after downloading all parts, then flash:"
            echo ""
            echo "  Linux/macOS:  cat ${img}.part-* > ${img}"
            echo "  Windows cmd:  copy /b ${img}.part-00+${img}.part-01+... ${img}"
            echo ""
            echo "Verify integrity (sha256 of the rejoined file):"
            echo "  sha256sum -c ${img}.parts.sha256   # or compare with the .sha256 content"
            echo ""
            echo "Flash with balenaEtcher/Rufus (accepts .img.gz directly) or:"
            echo "  zcat ${img} | sudo dd of=/dev/sdX bs=4M status=progress"
          } > RELEASE_NOTES.md

          # Release tag must reference a commit; point it at default branch head.
          gh release create "${TAG}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "${version} (${DATE})" \
            --notes-file RELEASE_NOTES.md \
            || gh release view "${TAG}" --repo "${{ github.repository }}"

          gh release upload "${TAG}" \
            "${img}".part-* "${img}.parts.sha256" ${img}.sha256 RELEASE_NOTES.md \
            --repo "${{ github.repository }}" --clobber
          # Remove the huge blob from the workspace so the runner isn't billed
          # for keeping it around during post-job cleanup.
          rm -f "${img}" "${img}".part-*
          gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | {name, size}'
          gh release view "${TAG}" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[] | {name, size}'
